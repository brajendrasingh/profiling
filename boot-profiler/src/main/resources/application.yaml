server:
  servlet:
    context-path: /
  port: 8080
  # Restrict Tomcat thread pool for easier reproduction of thread issues like blockage
  tomcat:
    threads:
      max: 10
      min-spare: 2

spring:
  application:
    name: boot-profiler

  datasource:
    url: jdbc:h2:mem:ems
    driverClassName: org.h2.Driver
    username: root
    password: root
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

#For capturing thread dumps & heapdump
management:
  endpoint:
    heapdump:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,threaddump,heapdump